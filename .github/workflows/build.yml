name: Build and Test

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: |
          pip install --upgrade pip
          pip install -r requirements.txt
      - name: Verify syntax
        run: python -m compileall config pages utils tests web
      - name: Build Docker
        run: docker build -t erp-automation:${{ github.sha }} .
      - name: Success
        run: echo "✅ Build successful!"
