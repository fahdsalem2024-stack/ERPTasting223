name: ERP Tests

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  schedule:
    # كل يوم الساعة 8 صباحاً بتوقيت مصر
    - cron: '0 6 * * *'
  workflow_dispatch:

jobs:
  test:
    runs-on: windows-latest
    timeout-minutes: 30

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install allure-pytest slack-sdk

      - name: Setup Chrome
        uses: browser-actions/setup-chrome@v1

      - name: Download ChromeDriver
        run: |
          python -c "from webdriver_manager.chrome import ChromeDriverManager; from shutil import copyfile; import os; os.makedirs('drivers', exist_ok=True); copyfile(ChromeDriverManager().install(), 'drivers/chromedriver.exe')"

      - name: Create .env
        run: |
          echo "BASE_URL=${{ secrets.BASE_URL }}" >> .env
          echo "LOGIN_USERNAME=${{ secrets.LOGIN_USERNAME }}" >> .env
          echo "LOGIN_PASSWORD=${{ secrets.LOGIN_PASSWORD }}" >> .env

      - name: Run tests
        run: |
          python -m pytest tests/functional/test_03_sales_invoice.py -v --alluredir=reports/allure-results

      - name: Upload Screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: screenshots
          path: reports/screenshots/

      - name: Upload Allure Results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: allure-results
          path: reports/allure-results/

      - name: Notify Slack
        if: failure()
        run: |
          curl -X POST -H 'Content-type: application/json' --data '{"text":"❌ ERP Tests Failed on GitHub Actions"}' ${{ secrets.SLACK_WEBHOOK }}
