{% extends "base.html" %}

{% block title %}Allure Report - {{ site_name }}{% endblock %}

{% block content %}
<div class="animate-in">
    <div class="d-flex justify-content-between align-items-center mb-4">
        <div>
            <h1 class="display-5 fw-bold mb-2">
                <i class="bi bi-graph-up-arrow text-primary"></i>
                تقرير Allure
            </h1>
            <p class="text-muted fs-5 mb-0">تقرير شامل لنتائج الاختبارات</p>
        </div>
        <div>
            <button class="btn btn-primary" onclick="generateReport()">
                <i class="bi bi-arrow-clockwise"></i> تحديث التقرير
            </button>
        </div>
    </div>

    <div id="statusCard" class="card mb-4">
        <div class="card-body">
            <div class="row g-3">
                <div class="col-md-3">
                    <div class="text-muted small">Allure CLI</div>
                    <div id="cliStatus" class="fw-bold">—</div>
                </div>
                <div class="col-md-3">
                    <div class="text-muted small">نتائج الاختبارات</div>
                    <div id="resultsStatus" class="fw-bold">—</div>
                </div>
                <div class="col-md-3">
                    <div class="text-muted small">التقرير المُولّد</div>
                    <div id="reportStatus" class="fw-bold">—</div>
                </div>
                <div class="col-md-3">
                    <div class="text-muted small">الإجراء</div>
                    <button class="btn btn-sm btn-success" onclick="generateReport()">
                        <i class="bi bi-play"></i> توليد
                    </button>
                    <button class="btn btn-sm btn-outline-primary" onclick="openReport()">
                        <i class="bi bi-box-arrow-up-right"></i> فتح
                    </button>
                </div>
            </div>
        </div>
    </div>

    <div id="alertBox"></div>

    <div class="card">
        <div class="card-body p-0">
            <iframe id="allureFrame" 
                    src="/allure-report/index.html" 
                    style="width:100%;height:80vh;border:0;"
                    onerror="showError('التقرير لسه ما اتولّدش')"></iframe>
        </div>
    </div>
</div>
{% endblock %}

{% block extra_js %}
<script>
async function loadStatus() {
    try {
        const res = await fetch('/api/allure/status');
        const data = await res.json();

        document.getElementById('cliStatus').innerHTML = data.cli_installed
            ? '<span class="text-success">✅ مثبّت</span>'
            : '<span class="text-danger">❌ غير مثبّت</span>';

        document.getElementById('resultsStatus').innerHTML = data.results_count > 0
            ? `<span class="text-success">✅ ${data.results_count} نتيجة</span>`
            : '<span class="text-warning">⚠️ فاضي</span>';

        document.getElementById('reportStatus').innerHTML = data.report_index
            ? '<span class="text-success">✅ موجود</span>'
            : '<span class="text-warning">⚠️ مش موجود</span>';
    } catch (e) {
        console.error(e);
    }
}

async function generateReport() {
    const alertBox = document.getElementById('alertBox');
    alertBox.innerHTML = '<div class="alert alert-info">⏳ جاري توليد التقرير...</div>';

    try {
        const res = await fetch('/api/allure/generate', { method: 'POST' });
        const data = await res.json();

        if (data.success) {
            alertBox.innerHTML = '<div class="alert alert-success">✅ تم توليد التقرير بنجاح</div>';
            setTimeout(() => {
                document.getElementById('allureFrame').src = '/allure-report/index.html?' + Date.now();
                loadStatus();
            }, 1000);
        } else {
            alertBox.innerHTML = `<div class="alert alert-danger">❌ ${data.error}</div>`;
        }
    } catch (e) {
        alertBox.innerHTML = `<div class="alert alert-danger">❌ ${e.message}</div>`;
    }
}

function openReport() {
    window.open('/allure-report/index.html', '_blank');
}

loadStatus();
</script>
{% endblock %}
